name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        # Pages serves this repo from /villa25ekas/, so every absolute asset
        # path needs that prefix. Drop to "/" when the custom domain is live.
        env:
          VITE_BASE: /villa25ekas/
        run: npm run build

      - name: Add the owner forms alongside the site
        # They are plain static HTML and have nothing to do with the Vite build,
        # so they are copied in rather than bundled. Keeps
        # /villa25ekas/forms/ working exactly as it does today.
        run: cp -r forms site/dist/forms

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
