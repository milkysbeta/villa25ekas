name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        # Pages serves this repo from /villa25ekas/, so every absolute asset
        # path needs that prefix. Drop to "/" when the custom domain is live.
        env:
          VITE_BASE: /
        run: npm run build

      - name: Add the owner forms alongside the site
        # They are plain static HTML and have nothing to do with the Vite build,
        # so they are copied in rather than bundled.
        run: cp -r forms site/dist/forms

      - name: Write a real HTML file for every page
        # Pages has no server-side routing — a URL only exists if a file exists
        # at it. Without this /demo/stay would 404 on a hard refresh or a shared
        # link, working only if you clicked through from another page.
        run: node tools/write-pages.mjs

      - name: Check the build produced what we expect
        # A deploy that silently ships the wrong thing is worse than one that
        # fails loudly. These four files are the ones whose absence would not
        # be obvious until someone opened the site.
        run: |
          set -e
          for f in index.html demo/index.html demo/stay/index.html demo/contact/index.html assets/app.js forms/index.html; do
            test -f "site/dist/$f" || { echo "MISSING: $f"; exit 1; }
            echo "ok  $f"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
