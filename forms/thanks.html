<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Villa 25 Ekas</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --ink:#16130E; --ink2:#3A3327; --paper:#F7F2E7; --card:#FFFDF7;
  --line:#DED3BC; --line2:#C6B899; --bronze:#9C6C36; --bronze2:#845A2A;
  --reef:#1D5450; --muted:#6F6555;
  --fd:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --ft:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --fu:ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#F0E8D7; --ink2:#C8BCA5; --paper:#0F0D0A; --card:#191510;
    --line:#302A21; --line2:#473E31; --bronze:#C99A5C; --bronze2:#E2B87E;
    --reef:#66B2A8; --muted:#94886F;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ft);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--reef),var(--bronze) 48%,var(--line2) 72%,var(--reef))}
.wrap{max-width:520px}
.mark{display:flex;flex-direction:column;align-items:center;line-height:1;margin-bottom:40px}
.m1,.m3{font-family:var(--fd);font-size:16px;letter-spacing:.42em;text-indent:.42em;
  text-transform:uppercase;color:var(--ink2)}
.m2{font-family:var(--fd);font-size:52px;color:var(--bronze);margin:7px 0 3px}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(32px,5.6vw,46px);line-height:1.08;
  margin:0 0 20px;letter-spacing:-.015em;text-wrap:balance}
p{margin:0 0 15px;color:var(--ink2)}
.small{font-size:15px;color:var(--muted)}
.back{display:inline-block;margin-top:28px;font-family:var(--fu);font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bronze2);
  text-decoration:none;border:1px solid var(--line2);padding:13px 24px;border-radius:3px;
  transition:border-color .16s,color .16s}
.back:hover{border-color:var(--bronze);color:var(--bronze)}
.back:focus-visible{outline:2px solid var(--reef);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">
    <span class="m1">Villa</span>
    <span class="m2">25</span>
    <span class="m3">Ekas</span>
  </div>

  <h1>Got it — thank you</h1>
  <p>Your answers have come through.</p>
  <p class="small">Your form is still saved on this device, so if you left anything blank you
     can go back, fill it in, and send again. Only the newest version gets used.</p>

  <a class="back" href="index.html">Back to the forms</a>
</div>
</body>
</html>
